; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
build_unflags = 
	-DARDUINO_USB_MODE=1
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue
	-Wno-macro-redefined
	-DUSE_TINYUSB=1
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 240000000L
build_type = debug
lib_deps = 
	fortyseveneffects/MIDI Library@^5.0.2
	h2zero/NimBLE-Arduino@1.4.3
	dfrobot/DFRobot_RGBButton@^1.0.0
	adafruit/Adafruit SSD1306@^2.5.14
	https://github.com/Fattoresaimon/ArduinoDuPPaLib
	adafruit/Adafruit MAX1704X @ ^1.0.3
	sparkfun/SX1509 IO Expander@^3.0.6
	lathoub/BLE-MIDI@^2.2
	adafruit/Adafruit TinyUSB Library@^3.7.7
	mathertel/RotaryEncoder@^1.6.0
	olikraus/U8g2@^2.36.18
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_filters = default, log2file, esp32_exception_decoder
test_filter = HAL/test_RotaryEncoder
test_build_src = no

[env:BLE_MIDI_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = adafruit_feather_esp32s3
framework = arduino
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue
board_upload.flash_size = 4MB
board_build.flash_mode = qio
build_type = debug
monitor_speed = 115200
monitor_filters = default, log2file, esp32_exception_decoder
lib_deps = 
	h2zero/NimBLE-Arduino@1.4.3
	max22/ESP32-BLE-MIDI @ ^0.3.2
	lathoub/BLE-MIDI@^2.2
	fortyseveneffects/MIDI Library@^5.0.2
	mathertel/RotaryEncoder@^1.6.0
	olikraus/U8g2@^2.36.18
build_src_filter = 
	-<*>
	+<../misc/ESP32_BLE_MIDI_Device.cpp>

[env:noUSBmidi]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue
board_upload.flash_size = 4MB
board_build.flash_mode = qio
build_type = debug
lib_deps = 
	fortyseveneffects/MIDI Library@^5.0.2
	h2zero/NimBLE-Arduino@1.4.3
	dfrobot/DFRobot_RGBButton@^1.0.0
	adafruit/Adafruit SSD1306@^2.5.14
	https://github.com/Fattoresaimon/ArduinoDuPPaLib
	adafruit/Adafruit MAX1704X @ ^1.0.3
	sparkfun/SX1509 IO Expander@^3.0.6
	lathoub/BLE-MIDI@^2.2
	adafruit/Adafruit TinyUSB Library@^3.7.7
	mathertel/RotaryEncoder@^1.6.0
	olikraus/U8g2@^2.36.18
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_filters = default, log2file, esp32_exception_decoder
test_filter = HAL/test_Button
test_build_src = no

[env:test_button]
extends = env:noUSBmidi
test_filter = HAL/test_Button
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue

[env:test_encoder]
extends = env:noUSBmidi
test_filter = HAL/test_RotaryEncoder
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue
	-DBUTTON_DEBUG

[env:test_powerManager]
extends = env:noUSBmidi
test_filter = HAL/test_powerManager
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue
	-DTEST_SYS_PWR_DEBUG

[env:test_metronomeButton]
extends = env:noUSBmidi
test_filter = Buttons/test_metronomeButton
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue

[env:test_oled]
extends = env:noUSBmidi
test_filter = HAL/test_OledDisplay
build_flags = 
	-Iinclude
	-mfix-esp32-psram-cache-issue
