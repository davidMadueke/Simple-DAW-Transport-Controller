; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino

build_unflags = 
	-DARDUINO_USB_MODE=1 ; Removes default setting of usb peripheral as only serial interface
build_flags = 
	-Iinclude
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Wno-macro-redefined ; For lib conflicts with default included Nimble lib
	-DUSE_TINYUSB=1
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
board_upload.flash_size = 4MB
board_build.flash_mode = qio       ; Sets standard Quad SPI mode
board_build.f_flash = 80000000L    ; Locks flash frequency cleanly at 80MHz
;board_upload.wait_for_upload_port = false

build_type = debug
lib_deps = 
	fortyseveneffects/MIDI Library@^5.0.2
	h2zero/NimBLE-Arduino@1.4.3
	dfrobot/DFRobot_RGBButton@^1.0.0
	adafruit/Adafruit SSD1306@^2.5.14
	https://github.com/Fattoresaimon/ArduinoDuPPaLib
	adafruit/Adafruit MAX1704X @ ^1.0.3
	sparkfun/SX1509 IO Expander@^3.0.6
	esp-arduino-libs/ESP32_Knob@^0.0.1
	lathoub/BLE-MIDI@^2.2
	adafruit/Adafruit TinyUSB Library@^3.7.7
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_filters = default, log2file, esp32_exception_decoder
test_filter = HAL/test_UsbModule
test_build_src = no

[env:nimble_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = adafruit_feather_esp32_v2
upload_port = COM6
framework = arduino
build_type = debug
build_flags = 
	-Iinclude
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=5
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_port = COM6
monitor_speed = 115200
monitor_filters = default, log2file, esp32_exception_decoder
lib_deps = 
	h2zero/NimBLE-Arduino@^2.1.3 max22/ESP32-BLE-MIDI @ ^0.3.2
	lathoub/BLE-MIDI@^2.2
	fortyseveneffects/MIDI Library@^5.0.2
	adafruit/Adafruit TinyUSB Library@^3.7.7
build_src_filter = 
	-<*>
	+<../misc/NimBLE_Client.ino.cpp>

